<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Yash Patel | Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <link rel="stylesheet" href="style.css?v=11" />
  </head>
  <body>
    
    <nav class="ui-layer">
      <div class="corner top-left">
        <h1>YASH PATEL</h1>
        <span class="meta">ARCHIVE 2024–25</span>
      </div>

      <div class="corner top-right">
        <a href="https://instagram.com/vibinframes" target="_blank" class="link-hover">@vibinframes ↗</a>
        <div class="time-display" id="clock">00:00:00</div>
      </div>

      <div class="corner bottom-left">
        <div class="camera-info">
          <span id="cam-model">LOADING...</span>
          <span id="cam-lens">--</span>
          <span>
            ISO <span id="iso-val">--</span> &bull; 
            <span id="aperture-val">--</span> &bull; 
            <span id="shutter-val">--</span>
          </span>
        </div>
      </div>

      <div class="corner bottom-right">
        <div class="counter">
          <span id="current-slide">01</span>
          <span class="divider">/</span>
          <span id="total-slides">10</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </nav>

    <main class="gallery-view">
      <div class="gallery-track" id="track"></div>
    </main>

    <script>
      const imageList = [
        "images/A.JPG", "images/A1.JPG", "images/A2.JPG", 
        "images/A3.JPG", "images/A4.JPG", "images/A5.JPG", 
        "images/A6.JPG", "images/A7.JPG", "images/A8.JPG", 
        "images/B1.JPG"
      ];

      const track = document.getElementById('track');
      const currentSlideEl = document.getElementById('current-slide');
      const totalSlidesEl = document.getElementById('total-slides');
      const progressFill = document.getElementById('progress-fill');
      
      // UI Elements for EXIF
      const camModelEl = document.getElementById('cam-model');
      const isoEl = document.getElementById('iso-val');
      const apertureEl = document.getElementById('aperture-val');
      const shutterEl = document.getElementById('shutter-val');

      totalSlidesEl.innerText = imageList.length.toString().padStart(2, '0');

      // 1. Build Gallery
      imageList.forEach((src, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'image-wrapper';
        
        const img = document.createElement('img');
        img.dataset.src = src;
        img.alt = `Photo ${index + 1}`;
        if (index === 0) img.src = src;

        wrapper.appendChild(img);
        track.appendChild(wrapper);
      });

      // 2. Function to Extract and Display EXIF
      function updateExifData(imgElement) {
        // Use the EXIF library
        EXIF.getData(imgElement, function() {
          // Extract tags
          const model = EXIF.getTag(this, "Model");
          const iso = EXIF.getTag(this, "ISOSpeedRatings");
          const fNumber = EXIF.getTag(this, "FNumber");
          const exposure = EXIF.getTag(this, "ExposureTime");

          // Update DOM with Fallbacks
          camModelEl.innerText = model ? model : "DIGITAL CAPTURE";
          isoEl.innerText = iso ? iso : "--";
          
          // Format Aperture (e.g., 2.8 -> f/2.8)
          apertureEl.innerText = fNumber ? `f/${fNumber}` : "--";

          // Format Shutter Speed (Handle fractions if necessary)
          if (exposure) {
             // Sometimes it comes as a decimal (0.005), usually libraries handle fraction
             // If it's a simple number < 1, we might want to convert to fraction manually
             // But EXIF-JS usually returns the fraction object or string.
             // We will cast to string for safety.
             shutterEl.innerText = `${exposure.numerator}/${exposure.denominator}s`;
          } else {
             shutterEl.innerText = "--";
          }
          
          // Add a glitch effect class to text to show it updated
          document.querySelector('.camera-info').classList.add('flash-update');
          setTimeout(() => document.querySelector('.camera-info').classList.remove('flash-update'), 300);
        });
      }

      // 3. Observer
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target.querySelector('img');
            const index = Array.from(track.children).indexOf(entry.target);

            // Lazy Load
            if (img.dataset.src) {
              img.src = img.dataset.src;
              img.removeAttribute('data-src');
              img.onload = () => {
                img.classList.add('loaded');
                updateExifData(img); // Read EXIF once loaded
              };
            } else {
              // If already loaded, just read EXIF
              updateExifData(img);
            }

            // Update Counters
            currentSlideEl.innerText = (index + 1).toString().padStart(2, '0');
            const progress = ((index + 1) / imageList.length) * 100;
            progressFill.style.width = `${progress}%`;
          }
        });
      }, { root: track, threshold: 0.6 });

      document.querySelectorAll('.image-wrapper').forEach(wrap => observer.observe(wrap));

      // Clock
      setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
      }, 1000);

      // Scroll
      track.addEventListener("wheel", (evt) => {
        if (evt.deltaY !== 0) {
          track.scrollLeft += evt.deltaY;
          evt.preventDefault();
        }
      });
    </script>
  </body>
</html>
