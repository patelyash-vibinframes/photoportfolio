<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Yash Patel | Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    
    <nav class="ui-layer">
      <div class="corner top-left">
        <h1>YASH PATEL</h1>
        <span class="meta">ARCHIVE 2024–25</span>
      </div>

      <div class="corner top-right">
        <a href="https://instagram.com/vibinframes" target="_blank" class="link-hover">@vibinframes ↗</a>
        <div class="time-display" id="clock">00:00:00</div>
      </div>

      <div class="corner bottom-left">
        <div class="camera-info">
          <span id="cam-model">LOADING...</span>
          <span id="cam-lens">35MM F/2</span>
          <span id="stats-row">--</span>
        </div>
      </div>

      <div class="corner bottom-right">
        <div class="counter">
          <span id="current-slide">01</span>
          <span class="divider">/</span>
          <span id="total-slides">10</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </nav>

    <main class="gallery-view">
      <div class="gallery-track" id="track">
        </div>
    </main>

    <script>
      // --- CONFIGURATION ---
      // Update these filenames to match your folder exactly
      const imageList = [
        "images/A.JPG", "images/A1.JPG", "images/A2.JPG", 
        "images/A3.JPG", "images/A4.JPG", "images/A5.JPG", 
        "images/A6.JPG", "images/A7.JPG", "images/A8.JPG", 
        "images/B1.JPG", "images/B2.JPG", "images/B3.JPG"
      ];

      const track = document.getElementById('track');
      const currentSlideEl = document.getElementById('current-slide');
      const totalSlidesEl = document.getElementById('total-slides');
      const progressFill = document.getElementById('progress-fill');
      
      const camModelEl = document.getElementById('cam-model');
      const lensEl = document.getElementById('cam-lens');
      const statsEl = document.getElementById('stats-row');

      totalSlidesEl.innerText = imageList.length.toString().padStart(2, '0');

      // 1. Build the Gallery
      imageList.forEach((src, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'image-wrapper';
        
        const img = document.createElement('img');
        img.dataset.src = src;
        img.alt = `Photo ${index + 1}`;
        // Load first image immediately
        if (index === 0) img.src = src;

        wrapper.appendChild(img);
        track.appendChild(wrapper);
      });

      // 2. Logic: Fetch Data or Simulate
      function updateData(imgElement) {
        // Flash animation
        const infoBox = document.querySelector('.camera-info');
        infoBox.classList.add('flash-update');

        EXIF.getData(imgElement, function() {
          const model = EXIF.getTag(this, "Model");
          const iso = EXIF.getTag(this, "ISOSpeedRatings");
          const fNumber = EXIF.getTag(this, "FNumber");
          const exposure = EXIF.getTag(this, "ExposureTime");

          // Decide: Do we have real data?
          if (model || iso) {
             // Real Data Found
             camModelEl.innerText = model ? model : "DIGITAL CAPTURE";
             
             // Format Shutter (often comes as object {numerator, denominator})
             let shutter = "--";
             if (exposure) {
                shutter = (exposure.numerator && exposure.denominator) 
                  ? `${exposure.numerator}/${exposure.denominator}s` 
                  : `${exposure}s`;
             }

             // Update the single line
             statsEl.innerHTML = `ISO ${iso || 400} &bull; f/${fNumber || 2.8} &bull; ${shutter}`;
          
          } else {
             // Fallback: Generate Realistic Simulation
             simulateTechData();
          }

          // Remove flash class after animation
          setTimeout(() => infoBox.classList.remove('flash-update'), 300);
        });
      }

      function simulateTechData() {
        const isos = [200, 400, 800, 1600, 3200];
        const apertures = [1.4, 2.0, 2.8, 4.0, 5.6, 8.0];
        const shutters = ["1/125s", "1/250s", "1/500s", "1/1000s", "1/60s"];

        camModelEl.innerText = "FUJIFILM X-T200"; // Fallback Model Name
        lensEl.innerText = "35MM F/2";
        
        const rISO = isos[Math.floor(Math.random() * isos.length)];
        const rAp = apertures[Math.floor(Math.random() * apertures.length)];
        const rShut = shutters[Math.floor(Math.random() * shutters.length)];

        statsEl.innerHTML = `ISO ${rISO} &bull; f/${rAp} &bull; ${rShut}`;
      }

      // 3. Observer (Handles Lazy Loading & Triggering Data Update)
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target.querySelector('img');
            const index = Array.from(track.children).indexOf(entry.target);

            if (img.dataset.src) {
              img.src = img.dataset.src;
              img.removeAttribute('data-src');
              img.onload = () => {
                img.classList.add('loaded');
                updateData(img);
              };
            } else {
              // Image already loaded, just update stats
              updateData(img);
            }

            // Update Counter
            currentSlideEl.innerText = (index + 1).toString().padStart(2, '0');
            
            // Update Progress Bar
            const progress = ((index + 1) / imageList.length) * 100;
            progressFill.style.width = `${progress}%`;
          }
        });
      }, { root: track, threshold: 0.6 });

      document.querySelectorAll('.image-wrapper').forEach(wrap => observer.observe(wrap));

      // 4. Clock
      setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
      }, 1000);

      // 5. Horizontal Scroll fix for Mouse Wheel
      track.addEventListener("wheel", (evt) => {
        if (evt.deltaY !== 0) {
          track.scrollLeft += evt.deltaY;
          evt.preventDefault();
        }
      });
    </script>
  </body>
</html>
