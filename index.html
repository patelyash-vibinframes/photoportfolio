<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Yash Patel | Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=10" />
  </head>
  <body>
    
    <nav class="ui-layer">
      <div class="corner top-left">
        <h1>YASH PATEL</h1>
        <span class="meta">ARCHIVE 2024–25</span>
      </div>

      <div class="corner top-right">
        <a href="https://instagram.com/vibinframes" target="_blank" class="link-hover">@vibinframes ↗</a>
        <div class="time-display" id="clock">00:00:00</div>
      </div>

      <div class="corner bottom-left">
        <div class="camera-info">
          <span>CAM: FUJIFILM X-T200</span>
          <span>LENS: 35MM F/2</span>
          <span>ISO: <span id="iso-val">AUTO</span></span>
        </div>
      </div>

      <div class="corner bottom-right">
        <div class="counter">
          <span id="current-slide">01</span>
          <span class="divider">/</span>
          <span id="total-slides">10</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </nav>

    <main class="gallery-view">
      <div class="gallery-track" id="track">
        </div>
    </main>

    <script>
      // --- Configuration ---
      const imageList = [
        "images/A.JPG", "images/A1.JPG", "images/A2.JPG", 
        "images/A3.JPG", "images/A4.JPG", "images/A5.JPG", 
        "images/A6.JPG", "images/A7.JPG", "images/A8.JPG", 
        "images/B1.JPG"
      ];

      const track = document.getElementById('track');
      const currentSlideEl = document.getElementById('current-slide');
      const totalSlidesEl = document.getElementById('total-slides');
      const progressFill = document.getElementById('progress-fill');
      const isoVal = document.getElementById('iso-val');

      // 1. Initialize Gallery
      totalSlidesEl.innerText = imageList.length.toString().padStart(2, '0');

      imageList.forEach((src, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'image-wrapper';
        
        const img = document.createElement('img');
        img.dataset.src = src; // Lazy load setup
        img.alt = `Photography by Yash Patel ${index + 1}`;
        img.className = index === 0 ? 'loaded' : '';
        
        // Load first image immediately
        if (index === 0) img.src = src;

        wrapper.appendChild(img);
        track.appendChild(wrapper);
      });

      // 2. Observer for Lazy Loading & Counter Update
      const observerOptions = {
        root: track,
        threshold: 0.5 // Trigger when 50% of image is visible
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target.querySelector('img');
            const index = Array.from(track.children).indexOf(entry.target);
            
            // Lazy Load
            if (img.dataset.src) {
              img.src = img.dataset.src;
              img.removeAttribute('data-src');
              img.onload = () => img.classList.add('loaded');
            }

            // Update Counter
            currentSlideEl.innerText = (index + 1).toString().padStart(2, '0');
            
            // Update Progress Bar
            const progress = ((index + 1) / imageList.length) * 100;
            progressFill.style.width = `${progress}%`;

            // Simulate Changing ISO for "Tech" feel
            const randomISO = [100, 200, 400, 800, 1600, 3200];
            isoVal.innerText = randomISO[Math.floor(Math.random() * randomISO.length)];
          }
        });
      }, observerOptions);

      document.querySelectorAll('.image-wrapper').forEach(wrap => observer.observe(wrap));

      // 3. Simple Clock
      setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
      }, 1000);

      // 4. Horizontal Scroll Wheel mapping (for vertical mice)
      track.addEventListener("wheel", (evt) => {
        if (evt.deltaY !== 0) {
          track.scrollLeft += evt.deltaY;
          evt.preventDefault();
        }
      });

    </script>
  </body>
</html>
